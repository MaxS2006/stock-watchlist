name: Stock Watchlist Monitor

on:
  schedule:
    # Every 15 minutes, 13:00-21:45 UTC, Mon-Fri.
    # That window covers US market hours (9:30am-4:00pm ET) with margin on
    # both sides for EST/EDT, so it doesn't need adjusting for daylight saving.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit updated state.json

concurrency:
  group: stock-watchlist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DAILY_DROP_PCT: "5"
          WEEKLY_DROP_PCT: "8"
        run: python monitor.py

      - name: Commit updated state and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --cached --quiet || git commit -m "Update watchlist state and dashboard data [skip ci]"
          git push
