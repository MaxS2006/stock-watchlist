<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="emerald">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Watchlist Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ---- Accent (decorative/brand only — never used for up/down meaning) ---- */
  :root[data-theme="dark"][data-accent="emerald"] { --accent: #39ff9c; --accent-dim: #39ff9c33; --accent-bg: #39ff9c0d; --accent-glow: #39ff9c66; --accent-hover: #39ff9c99; }
  :root[data-theme="dark"][data-accent="cyan"]    { --accent: #39e5ff; --accent-dim: #39e5ff33; --accent-bg: #39e5ff0d; --accent-glow: #39e5ff66; --accent-hover: #39e5ff99; }
  :root[data-theme="dark"][data-accent="violet"]  { --accent: #b57bff; --accent-dim: #b57bff33; --accent-bg: #b57bff0d; --accent-glow: #b57bff66; --accent-hover: #b57bff99; }
  :root[data-theme="light"][data-accent="emerald"]{ --accent: #059669; --accent-dim: #05966940; --accent-bg: #0596691a; --accent-glow: #05966955; --accent-hover: #059669cc; }
  :root[data-theme="light"][data-accent="cyan"]   { --accent: #0891b2; --accent-dim: #0891b240; --accent-bg: #0891b21a; --accent-glow: #0891b255; --accent-hover: #0891b2cc; }
  :root[data-theme="light"][data-accent="violet"] { --accent: #7c3aed; --accent-dim: #7c3aed40; --accent-bg: #7c3aed1a; --accent-glow: #7c3aed55; --accent-hover: #7c3aedcc; }

  /* ---- Surfaces & ink (theme) ---- */
  :root[data-theme="dark"] {
    --bg: #06070a; --bg-radial: #0d1420;
    --surface: #0a0b11; --panel-1: #0d0f16; --panel-2: #0a0b11;
    --border: #1c2030; --border-soft: #161925;
    --text-heading: #eef; --text-body: #d8dae0; --text-price: #fff;
    --text-secondary: #9aa0ad; --text-muted: #5b6070; --text-muted-2: #6b7280;
    --text-dim: #767b88; --text-factor: #8a8d99; --text-faint: #3f4350;

    --pos: #39ff9c; --neg: #ff5577; --neg-on-bg: #ff8fa8;
    --pos-bg: #39ff9c14; --pos-bg-soft: #39ff9c0d; --pos-border: #39ff9c33; --pos-border-strong: #39ff9c44;
    --neg-bg: #ff557714; --neg-bg-soft: #ff55770d; --neg-border: #ff557733; --neg-border-strong: #ff557744;

    --chip-bg: #ffffff08; --chip-border: #ffffff14;
    --mixed-bg: #ffffff0a; --mixed-border: #ffffff1a;
    --neutral-badge-bg: #ffffff0d; --neutral-badge-border: #ffffff1a;
  }
  :root[data-theme="light"] {
    --bg: #eef0f4; --bg-radial: #ffffff;
    --surface: #ffffff; --panel-1: #ffffff; --panel-2: #f6f7fa;
    --border: #dde1e8; --border-soft: #e8eaf0;
    --text-heading: #12141c; --text-body: #2c2f3a; --text-price: #0a0b10;
    --text-secondary: #565b6c; --text-muted: #8890a0; --text-muted-2: #6d7285;
    --text-dim: #7a7f90; --text-factor: #6d7285; --text-faint: #a3a8b8;

    --pos: #059669; --neg: #dc2626; --neg-on-bg: #dc2626;
    --pos-bg: #0596691a; --pos-bg-soft: #05966912; --pos-border: #05966940; --pos-border-strong: #05966966;
    --neg-bg: #dc26261a; --neg-bg-soft: #dc262612; --neg-border: #dc262640; --neg-border-strong: #dc262666;

    --chip-bg: #0000000a; --chip-border: #00000018;
    --mixed-bg: #00000008; --mixed-border: #00000016;
    --neutral-badge-bg: #0000000a; --neutral-badge-border: #00000018;
  }

  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 20% 10%, var(--bg-radial) 0%, var(--bg) 45%);
    color: var(--text-body);
    font-family: 'Inter', sans-serif;
    padding: 20px;
    min-height: 100vh;
    transition: background-color .2s, color .2s;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 1280px; margin: 0 auto; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 4px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-glow);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-heading); }
  .live-tag {
    font-size: 10px; color: var(--accent); border: 1px solid var(--accent-dim);
    padding: 3px 8px; border-radius: 4px; margin-left: 10px;
    background: var(--accent-bg);
  }
  .clock { font-size: 12px; color: var(--text-muted-2); }

  .right-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .theme-controls { display: flex; align-items: center; gap: 8px; }
  .theme-btn {
    font-size: 10px; padding: 4px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-secondary); cursor: pointer; letter-spacing: .04em;
    transition: border-color .15s, color .15s;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
  .accent-swatches { display: flex; gap: 6px; }
  .accent-swatch {
    width: 15px; height: 15px; border-radius: 50%; cursor: pointer;
    background: var(--sw); border: none; padding: 0;
    box-shadow: 0 0 0 1px var(--border) inset;
    transition: transform .15s, box-shadow .15s;
  }
  .accent-swatch:hover { transform: scale(1.18); }
  .accent-swatch.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sw); }

  /* ---- Market Overview: a slim status-bar strip, market context rather
     than stock-specific data — visually lighter than both the watchlist
     cards and the Notable Movers panel (no border-per-item, no chart,
     no price, just label + today's % change). ---- */
  .market-strip {
    display: flex;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .market-item {
    flex: 1 1 110px;
    display: flex; flex-direction: column; gap: 3px;
    padding: 9px 14px;
    border-right: 1px solid var(--border-soft);
  }
  .market-item:last-child { border-right: none; }
  .market-label {
    font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted);
    display: flex; align-items: baseline; gap: 5px;
  }
  .market-symbol { color: var(--text-dim); font-size: 8.5px; }
  .market-pct { font-size: 14px; font-weight: 700; }

  .top-grid {
    display: grid;
    grid-template-columns: 2.2fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 800px) {
    .top-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel-1), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
  }
  .panel-label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between;
  }

  .hero-price { font-size: 34px; font-weight: 700; color: var(--text-price); }
  .hero-sub { font-size: 12px; margin-top: 2px; }
  .hero-sub.g { color: var(--pos); } .hero-sub.r { color: var(--neg); }
  .chart-featured { height: 220px; width: 100%; margin-top: 14px; position: relative; }
  .chart-mini { height: 84px; width: 100%; margin-top: 10px; position: relative; }
  .chart-empty {
    font-size: 10px; color: var(--text-muted); text-align: center; padding-top: 34px;
  }
  .chart-tooltip {
    position: absolute; top: 4px; left: 4px; z-index: 5; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 7px; font-size: 9px; line-height: 1.5; white-space: nowrap;
    box-shadow: 0 4px 12px #00000033;
  }
  .chart-tooltip .tt-date { color: var(--text-muted-2); }
  .chart-tooltip .tt-price { font-weight: 700; font-size: 11px; }
  .chart-tooltip .tt-price.g { color: var(--pos); } .chart-tooltip .tt-price.r { color: var(--neg); }
  .chart-tooltip .tt-range { color: var(--text-secondary); margin-top: 1px; }

  .alerts-panel .alert-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 12px;
  }
  .alert-row:last-child { border-bottom: none; }
  .alert-ticker { font-weight: 700; color: var(--text-price); }
  .alert-badge {
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    background: var(--neg-bg); color: var(--neg-on-bg); letter-spacing: 0.04em;
  }
  .empty-note { font-size: 11px; color: var(--text-muted); padding: 6px 0; }

  .stat-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 700px) {
    .stat-strip { grid-template-columns: repeat(2, 1fr); }
  }
  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-box .label { font-size: 9px; color: var(--text-muted); letter-spacing: .05em; text-transform: uppercase; }
  .stat-box .value { font-size: 18px; font-weight: 700; margin-top: 4px; color: var(--text-price); }
  .stat-box .value.g { color: var(--pos); }
  .stat-box .value.r { color: var(--neg); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: var(--accent-hover); transform: translateY(-2px); }
  .card.flagged { border-color: var(--neg-border-strong); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .ticker { font-size: 13px; font-weight: 700; letter-spacing: .03em; color: var(--text-heading); }
  .price { font-size: 17px; font-weight: 700; margin-top: 3px; color: var(--text-price); }
  .pct { font-size: 11px; margin-top: 6px; display: flex; gap: 10px; }
  .g { color: var(--pos); } .r { color: var(--neg); }
  .dot-flag {
    width: 6px; height: 6px; border-radius: 50%; background: var(--neg);
    box-shadow: 0 0 6px var(--neg); margin-top: 3px;
  }

  .rsi-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .rsi-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
    letter-spacing: .02em;
  }
  .rsi-badge.oversold { background: var(--pos-bg-soft); color: var(--pos); border: 1px solid var(--pos-border-strong); }
  .rsi-badge.overbought { background: var(--neg-bg-soft); color: var(--neg-on-bg); border: 1px solid var(--neg-border-strong); }
  .rsi-badge.neutral { background: var(--neutral-badge-bg); color: var(--text-factor); border: 1px solid var(--neutral-badge-border); }
  .rsi-num { font-size: 10px; color: var(--text-muted-2); }

  .read-line {
    margin-top: 9px; font-size: 10.5px; line-height: 1.45; color: var(--text-secondary);
    border-top: 1px solid var(--border-soft); padding-top: 9px;
  }

  .signal-bar {
    margin-top: 10px; padding: 8px 10px; border-radius: 6px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px;
  }
  .signal-bar.bullish { background: var(--pos-bg); border: 1px solid var(--pos-border); }
  .signal-bar.bearish { background: var(--neg-bg); border: 1px solid var(--neg-border); }
  .signal-bar.mixed { background: var(--mixed-bg); border: 1px solid var(--mixed-border); }
  .signal-label { font-size: 10px; font-weight: 700; letter-spacing: .03em; }
  .signal-bar.bullish .signal-label { color: var(--pos); }
  .signal-bar.bearish .signal-label { color: var(--neg-on-bg); }
  .signal-bar.mixed .signal-label { color: var(--text-factor); }
  .signal-score { font-size: 9px; color: var(--text-muted-2); font-family: 'JetBrains Mono', monospace; }

  .factor-row { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .factor {
    font-size: 8.5px; padding: 2px 6px; border-radius: 3px;
    background: var(--chip-bg); color: var(--text-dim); border: 1px solid var(--chip-border);
  }
  .factor.on-g { color: var(--pos); border-color: var(--pos-border); background: var(--pos-bg-soft); }
  .factor.on-r { color: var(--neg-on-bg); border-color: var(--neg-border); background: var(--neg-bg-soft); }

  footer { margin-top: 16px; text-align: center; font-size: 10px; color: var(--text-faint); }
  .loading-note { font-size: 12px; color: var(--text-muted); padding: 40px 0; text-align: center; }

  /* ---- Watchlist manager: add/remove tickers, committed straight to
     tickers.txt via the GitHub API. Sits outside #app (which the 5-min
     data poll wholesale-replaces) since its own state changes on user
     interaction, independent of the data refresh cycle. ---- */
  .watchlist-manager { margin-bottom: 12px; }
  .manager-hint { font-size: 10.5px; color: var(--text-muted); }
  .ticker-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .ticker-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--chip-bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 4px 4px 10px; font-size: 11px; font-weight: 700; color: var(--text-heading);
  }
  .ticker-chip-remove {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 2px 6px; border-radius: 3px;
    font-family: 'Inter', sans-serif;
  }
  .ticker-chip-remove:hover:not(:disabled) { color: var(--neg); background: var(--neg-bg-soft); }
  .ticker-chip-remove:disabled { opacity: .4; cursor: not-allowed; }
  .manager-add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .manager-input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-price); padding: 7px 10px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; width: 130px;
  }
  .manager-input:focus { outline: none; border-color: var(--accent); }
  .manager-btn {
    background: var(--accent-bg); border: 1px solid var(--accent-dim); color: var(--accent);
    border-radius: 6px; padding: 7px 14px; font-size: 11px; font-weight: 700; letter-spacing: .03em;
    cursor: pointer; font-family: 'Inter', sans-serif; transition: border-color .15s, background .15s;
  }
  .manager-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-hover); }
  .manager-btn:disabled { opacity: .5; cursor: not-allowed; }
  .manager-btn.subtle { background: transparent; border-color: var(--border); color: var(--text-muted); }
  .manager-status { font-size: 10.5px; margin-top: 8px; }
  .manager-status.error { color: var(--neg); }
  .manager-status.success { color: var(--pos); }
  .manager-status.info { color: var(--text-secondary); }
  .token-form {
    margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--border);
    border-radius: 6px; font-size: 10.5px; line-height: 1.5; color: var(--text-secondary);
  }
  .token-form a { color: var(--accent); }
  .token-form input { margin-top: 8px; width: 100%; max-width: 320px; text-transform: none; }
  .token-form-actions { margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .token-remember-label { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }

  /* ---- Notable Movers (deliberately flatter/quieter than the tracked-signal
     cards above — informational only, not part of the core watchlist) ---- */
  .movers-panel {
    margin-top: 16px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .movers-header {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .movers-title {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700;
  }
  .movers-disclaimer {
    font-size: 10.5px; color: var(--text-muted); font-style: italic;
  }
  .movers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .mover-chip {
    display: flex; flex-direction: column; gap: 3px;
    border: 1px solid var(--border-soft); border-radius: 6px;
    padding: 8px 10px;
  }
  .mover-ticker { font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: .02em; }
  .mover-price { font-size: 13px; font-weight: 700; color: var(--text-price); }
  .mover-pct { font-size: 11px; }

  /* ---- Explainer tooltips: hover on desktop, tap-toggle on touch devices.
     Beginner-friendly copy for RSI/factor/signal terms. A single shared,
     JS-positioned bubble (see explainer-tip.js below) rather than a CSS
     ::after on each trigger — pseudo-elements can't be clamped to the
     viewport, and a centered tooltip on a chip near a narrow phone's edge
     would otherwise get clipped off-screen. ---- */
  [data-tip] { cursor: help; }
  .explainer-tip {
    position: fixed;
    max-width: 200px;
    background: var(--panel-1);
    color: var(--text-body);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    box-shadow: 0 8px 20px #00000055;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease;
    z-index: 100;
  }
  .explainer-tip.visible { opacity: 1; }

  /* ---- Entrance animations ---- */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card, .anim-panel { animation: riseIn .5s cubic-bezier(.16,.84,.44,1) both; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <h1>Watchlist Terminal</h1>
      <span class="live-tag mono">&#9679; LIVE</span>
    </div>
    <div class="right-controls">
      <div class="clock mono" id="clock">Loading…</div>
      <div class="theme-controls">
        <button id="themeToggle" class="theme-btn mono" type="button" aria-label="Toggle light/dark theme">&#9679; DARK</button>
        <div class="accent-swatches" role="group" aria-label="Accent color">
          <button class="accent-swatch" data-accent="emerald" title="Emerald accent" style="--sw:#39ff9c"></button>
          <button class="accent-swatch" data-accent="cyan" title="Cyan accent" style="--sw:#39e5ff"></button>
          <button class="accent-swatch" data-accent="violet" title="Violet accent" style="--sw:#b57bff"></button>
        </div>
      </div>
    </div>
  </header>

  <div id="watchlistManager" class="panel watchlist-manager anim-panel">
    <div class="loading-note mono" style="padding:16px 0;">Loading watchlist manager&hellip;</div>
  </div>

  <div id="app">
    <div class="loading-note mono">Loading latest data&hellip;</div>
  </div>

  <footer class="mono">stock-watchlist &middot; auto-generated from monitor.py &middot; github pages</footer>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const DATA_URL = 'data.json';
const REFRESH_MS = 5 * 60 * 1000; // re-poll every 5 min in case the tab is left open
const REDUCE_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------------------- */
/* Theme + accent (session-only — no localStorage, always starts dark)    */
/* ---------------------------------------------------------------------- */

let theme = 'dark';
let accent = 'emerald';

function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-accent', accent);
  document.documentElement.style.colorScheme = theme;
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '● DARK' : '○ LIGHT';
  document.querySelectorAll('.accent-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.accent === accent);
  });
  rebuildAllCharts();
}

document.getElementById('themeToggle').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});
document.querySelectorAll('.accent-swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    accent = sw.dataset.accent;
    applyTheme();
  });
});

/* ---------------------------------------------------------------------- */
/* Formatting helpers                                                      */
/* ---------------------------------------------------------------------- */

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str === null || str === undefined ? '' : String(str);
  return d.innerHTML;
}

// Explainer tooltip attribute — hover on desktop, tap-toggle on touch
// devices, via the shared positioned bubble wired up below.
function tip(text) {
  return text ? `data-tip="${esc(text)}" tabindex="0"` : '';
}

let explainerTipEl = null;
let explainerTipTrigger = null;

function showExplainerTip(trigger) {
  const text = trigger.getAttribute('data-tip');
  if (!text) return;
  if (!explainerTipEl) {
    explainerTipEl = document.createElement('div');
    explainerTipEl.className = 'explainer-tip';
    document.body.appendChild(explainerTipEl);
  }
  explainerTipTrigger = trigger;
  explainerTipEl.textContent = text;
  explainerTipEl.classList.add('visible');

  const margin = 8;
  const rect = trigger.getBoundingClientRect();
  const bubbleRect = explainerTipEl.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - bubbleRect.width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - bubbleRect.width - margin));
  let top = rect.top - bubbleRect.height - 8;
  if (top < margin) top = rect.bottom + 8; // flip below if no room above
  explainerTipEl.style.left = left + 'px';
  explainerTipEl.style.top = top + 'px';
}

function hideExplainerTip() {
  explainerTipTrigger = null;
  if (explainerTipEl) explainerTipEl.classList.remove('visible');
}

document.addEventListener('mouseover', (e) => {
  const trigger = e.target.closest('[data-tip]');
  if (trigger) showExplainerTip(trigger);
});
document.addEventListener('mouseout', (e) => {
  const trigger = e.target.closest('[data-tip]');
  if (trigger && trigger === explainerTipTrigger) hideExplainerTip();
});
document.addEventListener('focusin', (e) => {
  const trigger = e.target.closest('[data-tip]');
  if (trigger) showExplainerTip(trigger);
});
document.addEventListener('focusout', (e) => {
  const trigger = e.target.closest('[data-tip]');
  if (trigger && trigger === explainerTipTrigger) hideExplainerTip();
});
document.addEventListener('click', (e) => {
  const trigger = e.target.closest('[data-tip]');
  if (!trigger) { hideExplainerTip(); return; }
  if (trigger === explainerTipTrigger) hideExplainerTip();
  else showExplainerTip(trigger);
});

function fmtPct(v) {
  if (v === null || v === undefined) return '&mdash;';
  const sign = v >= 0 ? '+' : '';
  return `${sign}${v.toFixed(1)}%`;
}

function pctClass(v) {
  return v >= 0 ? 'g' : 'r';
}

function fmtTime(iso) {
  if (!iso) return '&mdash;';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' }) + ' UTC';
}

/* ---------------------------------------------------------------------- */
/* Watchlist manager — add/remove tickers, committed to tickers.txt via   */
/* the GitHub Contents API. Reads are unauthenticated (public repo);      */
/* writes need a token, prompted once per browser tab and kept only in    */
/* sessionStorage — never embedded in this page's shipped code, so a      */
/* random visitor to the live dashboard has nothing to extract. GitHub's  */
/* own permission check on the token is what actually gates writes.       */
/* ---------------------------------------------------------------------- */

const GH_OWNER = 'MaxS2006';
const GH_REPO = 'stock-watchlist';
const GH_BRANCH = 'main';
const TICKERS_PATH = 'tickers.txt';
const TOKEN_SESSION_KEY = 'watchlist_gh_token';
const TICKER_PATTERN = /^[A-Z0-9]{1,6}([.\-][A-Z0-9]{1,4})?$/;
// Polling for the workflow-applied change to actually land, after dispatch.
const WATCH_POLL_ATTEMPTS = 10;
const WATCH_POLL_INTERVAL_MS = 4000;

function parseTickerList(text) {
  return text.split('\n')
    .map(l => l.trim())
    .filter(l => l && !l.startsWith('#'))
    .map(l => l.toUpperCase());
}

// Reads go through raw.githubusercontent.com rather than the GitHub REST
// API's Contents endpoint — testing found the Contents endpoint doesn't
// reliably send CORS headers for browser fetches (confirmed: /rate_limit,
// /repos/{o}/{r}, and /repos/{o}/{r}/actions/... all support CORS fine;
// /repos/{o}/{r}/contents consistently does not, both for this repo and a
// second unrelated one — a real GitHub API limitation, not a fluke). The
// raw content CDN is a different service and is CORS-reliable.
async function fetchRawTickers() {
  const resp = await fetch(
    `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${TICKERS_PATH}?_=${Date.now()}`,
    { cache: 'no-store' }
  );
  if (!resp.ok) throw new Error(`couldn't read tickers.txt (HTTP ${resp.status})`);
  return parseTickerList(await resp.text());
}

// Writes go through repository_dispatch (confirmed CORS-reliable, unlike
// the Contents API) rather than a direct commit from the browser. This
// workflow's own step actually edits tickers.txt server-side — see
// .github/workflows/watchlist-edit.yml — using the same GITHUB_TOKEN
// pattern the scheduled monitor workflow already uses to commit.
async function githubDispatchWatchlistChange(kind, ticker, token) {
  const eventType = kind === 'add' ? 'watchlist_add' : 'watchlist_remove';
  const resp = await fetch(
    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/dispatches`,
    {
      method: 'POST',
      headers: {
        Accept: 'application/vnd.github+json',
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ event_type: eventType, client_payload: { ticker } }),
    }
  );
  if (resp.status === 204) return;
  let detail = `HTTP ${resp.status}`;
  try {
    const errBody = await resp.json();
    if (errBody.message) detail = errBody.message;
  } catch (e) { /* ignore unparsable error body */ }
  throw new Error(detail);
}

async function waitForWatchlistChange(kind, ticker) {
  for (let i = 0; i < WATCH_POLL_ATTEMPTS; i++) {
    await new Promise(res => setTimeout(res, WATCH_POLL_INTERVAL_MS));
    try {
      const list = await fetchRawTickers();
      const has = list.includes(ticker);
      if ((kind === 'add' && has) || (kind === 'remove' && !has)) {
        wlTickers = list;
        return true;
      }
    } catch (e) { /* transient — keep polling */ }
  }
  return false;
}

function getSessionToken() { return sessionStorage.getItem(TOKEN_SESSION_KEY) || ''; }
function setSessionToken(t) { sessionStorage.setItem(TOKEN_SESSION_KEY, t); }
function clearSessionToken() { sessionStorage.removeItem(TOKEN_SESSION_KEY); }

let wlTickers = [];
let wlLoaded = false;
let wlBusy = false;
let wlShowTokenForm = false;
let wlStatus = null; // { type: 'error'|'success'|'info', text }
let wlPendingAction = null; // { kind: 'add'|'remove', ticker }

async function loadWatchlistFile() {
  try {
    wlTickers = await fetchRawTickers();
    wlLoaded = true;
  } catch (err) {
    wlStatus = { type: 'error', text: `Couldn't load the current watchlist: ${err.message}` };
  }
  renderWatchlistManager();
}

async function performWatchlistChange(kind, ticker, tokenOverride) {
  const token = tokenOverride || getSessionToken();
  if (!token) {
    wlPendingAction = { kind, ticker };
    wlShowTokenForm = true;
    wlStatus = null;
    renderWatchlistManager();
    return;
  }

  wlBusy = true;
  wlStatus = { type: 'info', text: kind === 'add' ? `Adding ${ticker}…` : `Removing ${ticker}…` };
  renderWatchlistManager();

  try {
    await githubDispatchWatchlistChange(kind, ticker, token);
    wlStatus = { type: 'info', text: 'Request accepted — applying via GitHub Actions…' };
    renderWatchlistManager();

    const confirmed = await waitForWatchlistChange(kind, ticker);
    const inputEl = document.getElementById('wlNewTicker');
    if (inputEl) inputEl.value = '';

    wlStatus = confirmed
      ? {
          type: 'success',
          text: kind === 'add'
            ? `${ticker} added — full analysis appears after the next scheduled run (~15 min).`
            : `${ticker} removed.`,
        }
      : {
          type: 'info',
          text: `Request sent — it can take a minute to land. Check the "Edit Watchlist" run in the Actions tab, or reload shortly.`,
        };
  } catch (err) {
    const msg = /401|403|Bad credentials/i.test(err.message)
      ? "that token was rejected — check it has permission to trigger workflows on this repo, then try again."
      : err.message;
    wlStatus = { type: 'error', text: `Couldn't update the watchlist: ${msg}` };
  } finally {
    wlBusy = false;
    renderWatchlistManager();
  }
}

function renderTickerChips() {
  if (!wlLoaded) return '<div class="manager-hint">Loading current watchlist&hellip;</div>';
  if (!wlTickers.length) return '<div class="manager-hint">No tickers yet — add one below.</div>';
  return `<div class="ticker-chip-row">${wlTickers.map(t => `
    <span class="ticker-chip mono">
      ${esc(t)}
      <button class="ticker-chip-remove" data-remove-ticker="${esc(t)}" ${wlBusy ? 'disabled' : ''} aria-label="Remove ${esc(t)}" title="Remove ${esc(t)}">&times;</button>
    </span>
  `).join('')}</div>`;
}

function renderTokenForm() {
  if (!wlShowTokenForm) return '';
  return `
    <div class="token-form">
      This needs a GitHub personal access token with permission to trigger a workflow on this repo, which then commits the change to <code>tickers.txt</code> for you.
      It's sent only for this request and kept, at most, in this browser tab's session storage — it's never part of this page's code.
      <a href="https://github.com/settings/tokens/new?description=stock-watchlist%20dashboard&scopes=repo" target="_blank" rel="noopener">Create one on GitHub &rarr;</a>
      <input type="password" id="wlTokenInput" class="manager-input mono" placeholder="ghp_&hellip;" autocomplete="off" />
      <div class="token-form-actions">
        <button class="manager-btn mono" id="wlTokenContinue" type="button">Continue</button>
        <button class="manager-btn subtle mono" id="wlTokenCancel" type="button">Cancel</button>
        <label class="token-remember-label"><input type="checkbox" id="wlTokenRememberCheckbox" checked /> remember for this tab</label>
      </div>
    </div>
  `;
}

function renderWatchlistManager() {
  const container = document.getElementById('watchlistManager');
  if (!container) return;
  const hasToken = !!getSessionToken();
  container.innerHTML = `
    <div class="panel-label">
      <span>MANAGE WATCHLIST</span>
      <span class="mono">${wlTickers.length}</span>
    </div>
    ${renderTickerChips()}
    <div class="manager-add-row">
      <input type="text" id="wlNewTicker" class="manager-input mono" placeholder="TICKER" maxlength="10" ${wlBusy ? 'disabled' : ''} />
      <button class="manager-btn mono" id="wlAddBtn" type="button" ${wlBusy ? 'disabled' : ''}>${wlBusy ? 'Working&hellip;' : 'Add'}</button>
      ${hasToken ? `<button class="manager-btn subtle mono" id="wlForgetToken" type="button">Forget token</button>` : ''}
    </div>
    ${wlStatus ? `<div class="manager-status ${wlStatus.type}">${esc(wlStatus.text)}</div>` : ''}
    ${renderTokenForm()}
    <div class="manager-hint" style="margin-top:8px;">Edits run via a GitHub Actions workflow that updates <code>tickers.txt</code> (usually within a few seconds); full price/RSI/signal analysis appears after the next scheduled run.</div>
  `;
}

document.addEventListener('click', async (e) => {
  const addBtn = e.target.closest('#wlAddBtn');
  const removeBtn = e.target.closest('[data-remove-ticker]');
  const forgetBtn = e.target.closest('#wlForgetToken');
  const tokenContinueBtn = e.target.closest('#wlTokenContinue');
  const tokenCancelBtn = e.target.closest('#wlTokenCancel');

  if (addBtn) {
    const input = document.getElementById('wlNewTicker');
    const raw = (input && input.value || '').trim().toUpperCase();
    if (!raw) return;
    if (!TICKER_PATTERN.test(raw)) {
      wlStatus = { type: 'error', text: `"${raw}" doesn't look like a valid ticker symbol.` };
      renderWatchlistManager();
      return;
    }
    if (wlTickers.includes(raw)) {
      wlStatus = { type: 'error', text: `${raw} is already in your watchlist.` };
      renderWatchlistManager();
      return;
    }
    await performWatchlistChange('add', raw);
    return;
  }

  if (removeBtn) {
    await performWatchlistChange('remove', removeBtn.getAttribute('data-remove-ticker'));
    return;
  }

  if (forgetBtn) {
    clearSessionToken();
    wlStatus = { type: 'info', text: 'Token forgotten for this browser tab.' };
    renderWatchlistManager();
    return;
  }

  if (tokenContinueBtn) {
    const tokenInput = document.getElementById('wlTokenInput');
    const rememberCheckbox = document.getElementById('wlTokenRememberCheckbox');
    const token = (tokenInput && tokenInput.value || '').trim();
    if (!token) return;
    if (rememberCheckbox && rememberCheckbox.checked) setSessionToken(token);
    wlShowTokenForm = false;
    const action = wlPendingAction;
    wlPendingAction = null;
    if (action) await performWatchlistChange(action.kind, action.ticker, token);
    return;
  }

  if (tokenCancelBtn) {
    wlShowTokenForm = false;
    wlPendingAction = null;
    renderWatchlistManager();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target && e.target.id === 'wlNewTicker' && e.key === 'Enter') {
    const btn = document.getElementById('wlAddBtn');
    if (btn) btn.click();
  }
  if (e.target && e.target.id === 'wlTokenInput' && e.key === 'Enter') {
    const btn = document.getElementById('wlTokenContinue');
    if (btn) btn.click();
  }
});

/* ---------------------------------------------------------------------- */
/* Count-up number animation                                              */
/* ---------------------------------------------------------------------- */

const prevValues = {}; // key -> last rendered numeric value, persists across polls

function animAttrs(key, value, opts = {}) {
  if (value === null || value === undefined) return 'data-anim-empty="1"';
  return [
    `data-anim-key="${esc(key)}"`,
    `data-anim-target="${value}"`,
    `data-anim-decimals="${opts.decimals ?? 2}"`,
    `data-anim-prefix="${esc(opts.prefix || '')}"`,
    `data-anim-suffix="${esc(opts.suffix || '')}"`,
    `data-anim-signed="${opts.signed ? 1 : 0}"`,
  ].join(' ');
}

function animateValue(el, from, to, { decimals, prefix, suffix, signed, duration = 650 }) {
  if (REDUCE_MOTION) {
    const sign = signed && to >= 0 ? '+' : '';
    el.textContent = prefix + sign + to.toFixed(decimals) + suffix;
    return;
  }
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = from + (to - from) * eased;
    const sign = signed && val >= 0 ? '+' : '';
    el.textContent = prefix + sign + val.toFixed(decimals) + suffix;
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function runAnimations(root) {
  root.querySelectorAll('[data-anim-target]').forEach(el => {
    const key = el.dataset.animKey;
    const target = parseFloat(el.dataset.animTarget);
    if (Number.isNaN(target)) { el.textContent = '—'; return; }
    const decimals = parseInt(el.dataset.animDecimals || '2', 10);
    const prefix = el.dataset.animPrefix || '';
    const suffix = el.dataset.animSuffix || '';
    const signed = el.dataset.animSigned === '1';
    const from = key in prevValues ? prevValues[key] : 0;
    animateValue(el, from, target, { decimals, prefix, suffix, signed });
    prevValues[key] = target;
  });
  root.querySelectorAll('[data-anim-empty]').forEach(el => { el.textContent = '—'; });
}

/* ---------------------------------------------------------------------- */
/* Candlestick charts (lightweight-charts)                                */
/* ---------------------------------------------------------------------- */

let chartRegistry = [];

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function teardownCharts() {
  chartRegistry.forEach(entry => {
    try { entry.resizeObserver.disconnect(); } catch (e) {}
    try { entry.chart.remove(); } catch (e) {}
  });
  chartRegistry = [];
}

function createCandleChart(container, candles, { showAxis }) {
  if (!window.LightweightCharts || !candles || candles.length < 2) {
    container.innerHTML = '<div class="chart-empty mono">not enough chart data</div>';
    return;
  }
  const posColor = cssVar('--pos');
  const negColor = cssVar('--neg');
  const textColor = cssVar('--text-muted-2');

  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: { background: { type: 'solid', color: 'transparent' }, textColor, fontFamily: "'JetBrains Mono', monospace", fontSize: 10 },
    grid: { vertLines: { visible: false }, horzLines: { visible: false } },
    rightPriceScale: { visible: showAxis, borderVisible: false },
    timeScale: { visible: showAxis, borderVisible: false, timeVisible: false, fixLeftEdge: true, fixRightEdge: true },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: textColor, width: 1, style: 3, labelVisible: showAxis },
      horzLine: { visible: showAxis, labelVisible: showAxis },
    },
    handleScroll: false,
    handleScale: false,
  });

  const series = chart.addCandlestickSeries({
    upColor: posColor, downColor: negColor,
    borderUpColor: posColor, borderDownColor: negColor,
    wickUpColor: posColor, wickDownColor: negColor,
  });
  series.setData(candles.map(c => ({ time: c.t, open: c.o, high: c.h, low: c.l, close: c.c })));
  chart.timeScale().fitContent();

  const tooltip = document.createElement('div');
  tooltip.className = 'chart-tooltip mono';
  tooltip.style.display = 'none';
  container.appendChild(tooltip);

  chart.subscribeCrosshairMove(param => {
    if (!param.point || !param.time || param.point.x < 0 || param.point.y < 0) {
      tooltip.style.display = 'none';
      return;
    }
    const bar = param.seriesData.get(series);
    if (!bar) { tooltip.style.display = 'none'; return; }
    const up = bar.close >= bar.open;

    tooltip.textContent = '';
    const dateEl = document.createElement('div');
    dateEl.className = 'tt-date';
    dateEl.textContent = String(param.time);
    const priceEl = document.createElement('div');
    priceEl.className = 'tt-price ' + (up ? 'g' : 'r');
    priceEl.textContent = '$' + bar.close.toFixed(2);
    const rangeEl = document.createElement('div');
    rangeEl.className = 'tt-range';
    rangeEl.textContent = `O ${bar.open.toFixed(2)}  H ${bar.high.toFixed(2)}  L ${bar.low.toFixed(2)}`;
    tooltip.append(dateEl, priceEl, rangeEl);
    tooltip.style.display = 'block';

    const maxLeft = Math.max(4, container.clientWidth - 110);
    const left = Math.min(Math.max(param.point.x + 10, 4), maxLeft);
    tooltip.style.left = left + 'px';
  });

  const ro = new ResizeObserver(() => {
    if (container.clientWidth > 0) chart.resize(container.clientWidth, container.clientHeight);
  });
  ro.observe(container);

  chartRegistry.push({ chart, resizeObserver: ro });
}

function buildCharts(data) {
  teardownCharts();
  if (data.featured_mover) {
    const el = document.getElementById('featured-chart');
    if (el) createCandleChart(el, data.featured_mover.candles, { showAxis: true });
  }
  (data.stocks || []).forEach(stock => {
    const el = document.getElementById(`chart-${stock.symbol}`);
    if (el) createCandleChart(el, stock.candles, { showAxis: false });
  });
}

let lastData = null;
function rebuildAllCharts() {
  if (lastData) buildCharts(lastData);
}

/* ---------------------------------------------------------------------- */
/* Rendering                                                               */
/* ---------------------------------------------------------------------- */

// Beginner-friendly, 1-2 sentence explanations for every technical term
// shown on a card. Keyed by the specific reading so the tooltip can name
// what's actually happening, not just define the term in the abstract.
const RSI_TOOLTIPS = {
  oversold: "RSI (Relative Strength Index) tracks how fast the price has moved lately, on a 0-100 scale. Below 30, like here, suggests it's dropped quickly and could bounce back — though that's not guaranteed.",
  overbought: "RSI (Relative Strength Index) tracks how fast the price has moved lately, on a 0-100 scale. Above 70, like here, suggests it's climbed quickly and could cool off — though strong trends can keep going.",
  neutral: "RSI (Relative Strength Index) tracks how fast the price has moved lately, on a 0-100 scale. This reading is in the normal range — no strong signal either way.",
};

const SIGNAL_TOOLTIPS = {
  "LEANS POSITIVE": "More of the factors below point positive than negative right now. It's a mechanical tally of technicals, not investment advice.",
  "LEANS NEGATIVE": "More of the factors below point negative than positive right now. It's a mechanical tally of technicals, not investment advice.",
  "MIXED SIGNALS": "The factors below are evenly split between positive and negative — no clear lean either way.",
  "NOTHING COMPELLING": "Most factors below are neutral right now — there isn't much of a signal to read either way.",
};

function factorTooltip(f) {
  const label = f.label;
  if (label.startsWith('RSI ')) {
    return RSI_TOOLTIPS[f.lean === 'pos' ? 'oversold' : f.lean === 'neg' ? 'overbought' : 'neutral'];
  }
  if (label.startsWith('Vol:')) {
    return f.lean === 'neutral'
      ? "Trading volume compared to its normal 20-day average — this is roughly typical, nothing unusual."
      : "Trading volume compared to its normal 20-day average. Unusually high volume often means a move has real conviction behind it, not just noise.";
  }
  if (label === 'Above 50d avg') {
    return "Compares the current price to its average over the last 50 trading days. Being above that average is a sign of a longer-term uptrend.";
  }
  if (label === 'Below 50d avg') {
    return "Compares the current price to its average over the last 50 trading days. Being below that average is a sign of a longer-term downtrend.";
  }
  if (label.startsWith('Sector-wide')) {
    return "Most of your watchlist is moving the same way today, so this looks like a broad market or sector move rather than news about this specific company.";
  }
  if (label === 'Stock-specific move') {
    return "This stock is moving noticeably differently from the rest of your watchlist today — suggests something specific to this company, not just the wider market.";
  }
  if (label === 'No earnings soon') {
    return "No earnings report is expected from this company in the next couple of weeks.";
  }
  if (label === 'Earnings just passed') {
    return "This company reported earnings in the last few days — the stock may still be reacting to that news.";
  }
  if (label.startsWith('Earnings in')) {
    return "This company reports earnings soon. These announcements often cause bigger-than-usual price swings.";
  }
  return '';
}

function rsiBadge(stock) {
  if (stock.rsi === null || stock.rsi === undefined) return '';
  return `<div class="rsi-row" ${tip(RSI_TOOLTIPS[stock.rsi_label])}>
    <span class="rsi-badge ${stock.rsi_label} mono">${esc(stock.rsi_label.toUpperCase())}</span>
    <span class="rsi-num mono">RSI ${stock.rsi.toFixed(0)}</span>
  </div>`;
}

function factorChips(factors) {
  if (!factors || !factors.length) return '';
  return `<div class="factor-row">${factors.map(f => {
    const cls = f.lean === 'pos' ? 'on-g' : f.lean === 'neg' ? 'on-r' : '';
    return `<span class="factor ${cls}" ${tip(factorTooltip(f))}>${esc(f.label)}</span>`;
  }).join('')}</div>`;
}

function signalBar(signal) {
  if (!signal) return '';
  return `<div class="signal-bar ${signal.class}">
    <span class="signal-label mono" ${tip(SIGNAL_TOOLTIPS[signal.label])}>${signal.icon} ${esc(signal.label)}</span>
    <span class="signal-score mono">${signal.up} up &middot; ${signal.down} down &middot; ${signal.neutral} neutral</span>
  </div>`;
}

function renderCard(stock, index) {
  const delay = Math.min(index * 30, 300);
  const priceAttrs = animAttrs(`${stock.symbol}:price`, stock.price, { prefix: '$', decimals: 2 });
  const dayAttrs = animAttrs(`${stock.symbol}:day`, stock.daily_pct, { decimals: 1, suffix: '%', signed: true });
  const weekAttrs = animAttrs(`${stock.symbol}:week`, stock.weekly_pct, { decimals: 1, suffix: '%', signed: true });
  return `<div class="card ${stock.flagged ? 'flagged' : ''}" style="animation-delay:${delay}ms">
    <div class="card-top">
      <div class="ticker">${esc(stock.symbol)}</div>
      ${stock.flagged ? '<div class="dot-flag"></div>' : ''}
    </div>
    <div class="price mono" ${priceAttrs}>&mdash;</div>
    <div class="pct mono">
      <span class="${pctClass(stock.daily_pct || 0)}" ${dayAttrs}>&mdash;</span>
      <span class="${pctClass(stock.weekly_pct || 0)}" ${weekAttrs}>&mdash;</span>
    </div>
    <div class="chart-mini" id="chart-${esc(stock.symbol)}"></div>
    ${rsiBadge(stock)}
    ${stock.read_line ? `<div class="read-line">${esc(stock.read_line)}</div>` : ''}
    ${factorChips(stock.factors)}
    ${signalBar(stock.signal)}
  </div>`;
}

function renderFeatured(mover) {
  if (!mover) return '<div class="panel anim-panel"><div class="panel-label"><span>FEATURED MOVER</span></div><div class="empty-note">No data yet.</div></div>';
  const weekPositive = (mover.weekly_pct || 0) >= 0;
  const priceAttrs = animAttrs('featured:price', mover.price, { prefix: '$', decimals: 2 });
  const dayAttrs = animAttrs('featured:day', mover.daily_pct, { decimals: 1, suffix: '% today', signed: true });
  const weekAttrs = animAttrs('featured:week', mover.weekly_pct, { decimals: 1, suffix: '% this week', signed: true });
  return `<div class="panel anim-panel">
    <div class="panel-label"><span>${esc(mover.symbol)} &mdash; FEATURED MOVER</span><span class="mono">1W</span></div>
    <div class="hero-price mono" ${priceAttrs}>&mdash;</div>
    <div class="hero-sub ${pctClass(mover.weekly_pct || 0)} mono">${weekPositive ? '&#9650;' : '&#9660;'} <span ${weekAttrs}>&mdash;</span> &middot; <span ${dayAttrs}>&mdash;</span></div>
    <div class="chart-featured" id="featured-chart"></div>
  </div>`;
}

function renderMarketOverview(overview) {
  if (!overview || !overview.length) return '';
  const items = overview.map(m => {
    const pctAttrs = animAttrs(`market:${m.symbol}:pct`, m.daily_pct, { decimals: 1, suffix: '%', signed: true });
    return `<div class="market-item">
      <span class="market-label">${esc(m.label)} <span class="market-symbol mono">${esc(m.symbol)}</span></span>
      <span class="market-pct mono ${pctClass(m.daily_pct || 0)}" ${pctAttrs}>&mdash;</span>
    </div>`;
  }).join('');
  return `<div class="market-strip anim-panel">${items}</div>`;
}

function renderNotableMovers(movers) {
  if (!movers || !movers.length) return '';
  const chips = movers.map(m => {
    const priceAttrs = animAttrs(`movers:${m.symbol}:price`, m.price, { prefix: '$', decimals: 2 });
    const pctAttrs = animAttrs(`movers:${m.symbol}:pct`, m.daily_pct, { decimals: 1, suffix: '%', signed: true });
    return `<div class="mover-chip">
      <span class="mover-ticker mono">${esc(m.symbol)}</span>
      <span class="mover-price mono" ${priceAttrs}>&mdash;</span>
      <span class="mover-pct mono ${pctClass(m.daily_pct || 0)}" ${pctAttrs}>&mdash;</span>
    </div>`;
  }).join('');
  return `<div class="movers-panel anim-panel">
    <div class="movers-header">
      <span class="movers-title mono">Notable Movers</span>
      <span class="movers-disclaimer">for awareness, not a recommendation &mdash; a wider market scan, not part of your tracked watchlist</span>
    </div>
    <div class="movers-grid">${chips}</div>
  </div>`;
}

function renderAlertsPanel(data) {
  const flagged = data.flagged || [];
  const rows = flagged.length
    ? flagged.map(f => `<div class="alert-row">
        <span class="alert-ticker mono">${esc(f.symbol)}</span>
        <span class="alert-badge mono">${esc(f.badge)}</span>
      </div>`).join('')
    : '<div class="empty-note">Nothing currently flagged.</div>';

  const health = data.watchlist_health || {};
  const healthText = health.total
    ? `${health.green_count} of ${health.total} tickers green this week<br/>Avg weekly move: <span class="${pctClass(health.avg_weekly_pct || 0)} mono">${fmtPct(health.avg_weekly_pct)}</span>`
    : 'No data yet.';

  return `<div class="panel alerts-panel anim-panel">
    <div class="panel-label"><span>FLAGGED</span><span class="mono">${flagged.length}</span></div>
    ${rows}
    <div class="panel-label" style="margin-top:16px;"><span>WATCHLIST HEALTH</span></div>
    <div style="font-size:11px; color:var(--text-factor); line-height:1.6;">${healthText}</div>
  </div>`;
}

function renderStatStrip(data) {
  const flaggedCount = (data.flagged || []).length;
  const flaggedAttrs = animAttrs('stat:flagged', flaggedCount, { decimals: 0 });
  return `<div class="stat-strip">
    <div class="stat-box anim-panel"><div class="label">Tickers Tracked</div><div class="value mono">${data.tickers_tracked ?? '&mdash;'}</div></div>
    <div class="stat-box anim-panel" style="animation-delay:40ms"><div class="label">Flagged Now</div><div class="value ${flaggedCount ? 'r' : ''} mono" ${flaggedAttrs}>&mdash;</div></div>
    <div class="stat-box anim-panel" style="animation-delay:80ms"><div class="label">Checks / Day</div><div class="value mono">~${data.checks_per_day ?? '&mdash;'}</div></div>
    <div class="stat-box anim-panel" style="animation-delay:120ms"><div class="label">Best Performer</div><div class="value g mono">${esc(data.best_performer || '&mdash;')}</div></div>
  </div>`;
}

function render(data) {
  lastData = data;
  hideExplainerTip(); // about to replace #app's DOM, so drop any open tooltip
  document.getElementById('clock').innerHTML = `Last sync ${fmtTime(data.generated_at)} &middot; next ${fmtTime(data.next_sync_at)}`;

  const stocks = data.stocks || [];
  const cards = stocks.length
    ? stocks.map(renderCard).join('')
    : '<div class="loading-note mono">No ticker data yet &mdash; waiting for the first monitor.py run.</div>';

  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderMarketOverview(data.market_overview)}
    <div class="top-grid">
      ${renderFeatured(data.featured_mover)}
      ${renderAlertsPanel(data)}
    </div>
    ${renderStatStrip(data)}
    <div class="grid">${cards}</div>
    ${renderNotableMovers(data.notable_movers)}
  `;

  runAnimations(app);
  buildCharts(data);
}

async function load() {
  try {
    const resp = await fetch(DATA_URL, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    render(data);
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<div class="loading-note mono">No data yet &mdash; the dashboard will populate after the first scheduled run.<br/>(${esc(err.message)})</div>`;
  }
}

applyTheme();
load();
setInterval(load, REFRESH_MS);
loadWatchlistFile();
</script>
</body>
</html>
